version: '3.8'

services:
  # Frontend - React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: media-encoder-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  # Backend - Node.js API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media-encoder-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/media_encoder
      - REDIS_URL=redis://redis:6379
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET_NAME=media-encoder-bucket
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Worker - Python FFmpeg
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: media-encoder-worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/media_encoder
      - REDIS_URL=redis://redis:6379
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET_NAME=media-encoder-bucket
    depends_on:
      - redis
      - localstack
      - postgres

  # LocalStack - AWS Emulator
  localstack:
    image: localstack/localstack:latest
    container_name: localstack-media-encoder
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,sns
      - DEBUG=1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init.sh"
    healthcheck:
      test: [ "CMD", "awslocal", "s3", "ls" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres-media-encoder
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: media_encoder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Queue
  redis:
    image: redis:7-alpine
    container_name: redis-media-encoder
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
